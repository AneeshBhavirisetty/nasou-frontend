<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nivorva — the home-improvement marketplace</title>
    <meta name="description" content="Nivorva: plumbing, electrical, hardware and more from verified retailers — one cart, one checkout, every part tracked." />
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="theme-color" content="#095143" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Shown at once while the catalogue loads; React replaces it. -->
    <div id="root">
      <div style="min-height:100dvh;display:grid;place-items:center;background:#efeae1;font-family:Manrope,system-ui,sans-serif">
        <div style="text-align:center">
          <img src="/brand/nivorva-logo.png" alt="Nivorva" width="150" style="display:block;height:auto;margin:0 auto" />
          <p style="margin:18px 0 0;color:#255849;font-size:14px;font-weight:600">Loading the store…</p>
        </div>
      </div>
    </div>
    <script src="/config.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
