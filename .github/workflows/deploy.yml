# Test, build, point the build at the API (config.js) and publish to Azure
# Static Web Apps.
#
# One-time setup (nasou-api docs/AZURE.md, "GitHub Actions"):
#   secrets  AZURE_STATIC_WEB_APPS_API_TOKEN   (az staticwebapp secrets list -n <swa> --query properties.apiKey)
#   vars     API_BASE_URL                      e.g. https://app-nivora-prod-api-xxxx.azurewebsites.net/api/v1
#            SHOW_DEMO                         'true' only on staging
name: web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Runtime config
        run: |
          demo=false
          [ "${{ vars.SHOW_DEMO }}" = "true" ] && demo=true
          echo "window.__NIVORA__ = { apiBaseUrl: '${{ vars.API_BASE_URL }}', demo: $demo };" > dist/config.js
          cat dist/config.js
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && vars.API_BASE_URL != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true
