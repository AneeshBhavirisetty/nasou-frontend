# Branch = environment.
#
#   push to dev          test → build → publish to the dev Static Web App
#   pull request → prod  test and build only (the PR shows whether it is safe to merge)
#   merge / push to prod test → build → publish to the prod Static Web App
#
# One build serves every environment: config.js, written at release, says which
# API to use. Settings live in the GitHub environments "dev" and "prod" (each
# only accepts its own branch):
#   secrets  AZURE_STATIC_WEB_APPS_API_TOKEN   az staticwebapp secrets list -n <swa> --query properties.apiKey
#   vars     API_BASE_URL                      https://<api-app>.azurewebsites.net/api/v1
#            SHOW_DEMO                         'true' only where demo accounts exist (never prod)
name: web

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref_name == 'dev' || github.ref_name == 'prod')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Runtime config
        run: |
          demo=false
          [ "${{ vars.SHOW_DEMO }}" = "true" ] && demo=true
          echo "window.__NIVORA__ = { apiBaseUrl: '${{ vars.API_BASE_URL }}', demo: $demo };" > dist/config.js
          cat dist/config.js
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true
